<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Active Statics</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #text-panel {
            display: none;
            width: 500px;
            height: 100%;
            overflow-y: auto;
            padding: 24px;
            background: #f9f9f9;
            border-right: 2px solid #ccc;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        #text-panel.visible {
            display: block;
        }

        #text-panel h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 16px;
        }

        #text-panel h2 {
            font-size: 20px;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        #text-panel h3 {
            font-size: 16px;
            margin-top: 16px;
            margin-bottom: 8px;
            color: #666;
        }

        #text-panel p {
            line-height: 1.6;
            margin-bottom: 16px;
        }

        #text-panel ul {
            line-height: 1.8;
            margin-bottom: 16px;
            padding-left: 24px;
        }

        #text-panel hr {
            margin: 24px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        #main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        #breadcrumb {
            /* Breadcrumb styling in design-system.css */
            flex-shrink: 0;
        }

        #launcher-container {
            flex: 1;
            overflow-y: auto;
        }

        #myCanvas {
            display: block;
            width: 100%;
            /* Height set by JavaScript in handleResize() */
        }
    </style>
    <script type="text/javascript">
        // Only executed our code once the DOM is ready.
        window.onload = function() {
            window.startApp();
        }
    </script>
</head>
<body>
<div id="app-container">
    <div id="text-panel"></div>
    <div id="main">
        <div id="breadcrumb"></div>
        <div id="launcher-container"></div>
        <canvas id="myCanvas"></canvas>
    </div>
</div>
</body>
</html>
